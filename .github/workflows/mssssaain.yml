
name: PCYBER Tech + Tailscale RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. CONFIGURE RDP
      # ==========================================
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      # ==========================================
      # 2. CREATE RDP USER
      # ==========================================
      - name: Create RDP User
        shell: pwsh
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              throw "RDP user creation failed."
          }

      # ==========================================
      # 3. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait -PassThru

          Remove-Item $installerPath -Force

          if ($process.ExitCode -ne 0) {
              throw "Tailscale installation failed."
          }

      # ==========================================
      # 4. ESTABLISH TAILSCALE CONNECTION
      # ORIGINAL WORKING AUTHENTICATION
      # ==========================================
      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # 5. DOWNLOAD PCYBER TECH V1.0
      # ==========================================
      - name: Download PCYBER Tech v1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseApi = "https://api.github.com/repos/pcyberict/pcyber-tech/releases/tags/v1.0"
          $installFolder = "C:\PCYBER-Tech"

          New-Item -ItemType Directory -Path $installFolder -Force | Out-Null

          Write-Host "Retrieving PCYBER Tech v1.0 release information..."

          $release = Invoke-RestMethod `
            -Uri $releaseApi `
            -Headers @{ "User-Agent" = "PCYBER-RDP-Workflow" }

          if (-not $release.assets -or $release.assets.Count -eq 0) {
              throw "No downloadable assets were found in the v1.0 release."
          }

          $asset = $release.assets |
            Where-Object { $_.name -match '\.exe$' } |
            Select-Object -First 1

          $assetType = "exe"

          if (-not $asset) {
              $asset = $release.assets |
                Where-Object { $_.name -match '\.zip$' } |
                Select-Object -First 1

              $assetType = "zip"
          }

          if (-not $asset) {
              Write-Host "Available release assets:"
              $release.assets | ForEach-Object { Write-Host $_.name }
              throw "No EXE or ZIP application asset was found."
          }

          Write-Host "Selected asset: $($asset.name)"

          $downloadPath = Join-Path $installFolder $asset.name

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $downloadPath `
            -Headers @{ "User-Agent" = "PCYBER-RDP-Workflow" }

          if (-not (Test-Path $downloadPath)) {
              throw "PCYBER Tech download failed."
          }

          if ($assetType -eq "zip") {
              $extractFolder = Join-Path $installFolder "Extracted"

              New-Item -ItemType Directory -Path $extractFolder -Force | Out-Null

              Expand-Archive -Path $downloadPath -DestinationPath $extractFolder -Force

              $application = Get-ChildItem -Path $extractFolder -Filter "*.exe" -File -Recurse |
                Select-Object -First 1

              if (-not $application) {
                  throw "The ZIP archive contains no EXE application."
              }

              $applicationPath = $application.FullName
          }
          else {
              $applicationPath = $downloadPath
          }

          "PCYBER_TECH_EXE=$applicationPath" >> $env:GITHUB_ENV

          Write-Host "PCYBER Tech downloaded successfully."
          Write-Host "Application path: $applicationPath"

      # ==========================================
      # 6. VERIFY RDP ACCESSIBILITY
      # ==========================================
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"

      # ==========================================
      # 7. MAINTAIN CONNECTION + DOWNLOADS.BAT
      # ==========================================
      - name: Maintain Connection + Watch RDP User
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "PCYBER Tech: $env:PCYBER_TECH_EXE"
          Write-Host "==================`n"

          $rdpProfile = "C:\Users\RDP"

          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"

          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }

                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing

                      Write-Host "Downloads.bat copied successfully."

                      cmd /c $downloadPath

                      Write-Host "Downloads.bat executed successfully."

                      break
                  }
                  catch {
                      Write-Host "Downloads.bat error: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile..."
                  Start-Sleep -Seconds 30
              }
          }

          # Keep runner alive
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C to terminate."
              Start-Sleep -Seconds 300
          }
